# Gitea Actions — build self-hosted pe git.tcx.ro (paralel cu GitHub Actions din .github/workflows/).
# Ruleaza pe un act_runner cu eticheta ubuntu-latest mapata la o imagine Docker cu node+tools
# (ex. catthehacker/ubuntu:act-latest). Vezi SETUP-GITEA-CI.md.
name: Build APK (Gitea)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Rename APK cu versiunea
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/debug/app-debug.apk "nozero-${VERSION}.apk"
          ls -la "nozero-${VERSION}.apk"
          echo "APK_NAME=nozero-${VERSION}.apk" >> $GITHUB_ENV

      # Gitea Actions: upload-artifact v3 (v4 cere Gitea 1.21+ cu backend nou de artefacte).
      # APK-ul se descarca din pagina run-ului (Actions → run → Artifacts).
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}
