plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "com.example.logger"
    compileSdk 35

    defaultConfig {
        applicationId "ro.noze.app"   // rebrand 2026-06-11: decuplat de com.example.logger.
        // Google login se face VIA WEB (OAuth-ul lui noze.ro), NU nativ → numele de pachet e liber,
        // fara reinregistrare Google. Pachet diferit de BioEcho → coexista, fara conflict de instalare.
        minSdk 26
        targetSdk 34   // 34 (nu 35): evita edge-to-edge fortat de Android 15 care punea butoanele sub bara de navigatie. App sideloaded, deci targetSdk 34 e ok.
        versionCode 7
        versionName "2.5.0"

        buildConfigField "String", "SERVER_URL", "\"https://noze.ro\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID",
            "\"784597486644-50hoi1h5rsad4ano9cuf93mf9gtki365.apps.googleusercontent.com\""
    }

    buildFeatures {
        buildConfig true
    }

    // Acelasi keystore ca sensor-audio-gps => acelasi SHA-1 => OAuth Google merge fara re-inregistrare
    signingConfigs {
        debug {
            storeFile file("bioecho-debug.keystore")
            storePassword "bioecho2026"
            keyAlias "bioecho"
            keyPassword "bioecho2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false   // build de dezvoltare — avertismentele lint nu opresc build-ul
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    // WebViewCompat.addDocumentStartJavaScript (injecteaza bridge-ul inainte de scripturile modulului)
    implementation "androidx.webkit:webkit:1.11.0"
    // GPS nativ (FusedLocationProviderClient) pentru bridge-ul `location`
    implementation "com.google.android.gms:play-services-location:21.3.0"

    // ── portate din app-ul vechi (sensor-audio-gps) ──
    implementation "com.google.mlkit:barcode-scanning:17.2.0"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"
    implementation "org.osmdroid:osmdroid-android:6.1.17"
    // Sign in with Google nativ (GoogleLogin.kt — pastrat pana cablam login-ul web in hub)
    implementation "androidx.credentials:credentials:1.3.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.3.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.1.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    // BirdNET on-device (LiveListenActivity); modelul .tflite se descarca de pe noze.ro
    implementation "org.tensorflow:tensorflow-lite:2.14.0"
}
